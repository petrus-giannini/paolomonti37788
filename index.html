<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Paolo Monti 37788</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="canvas-wrap"><canvas id="globe-canvas"></canvas></div>

<div class="ui-layer">
  <div class="top-row">
    <div class="btn-row">
      <button class="icon-btn" id="btn-sat" title="Segui il satellite in tempo reale" aria-label="Segui il satellite">
        <span class="dollar-icon">$</span>
      </button>
      <button class="icon-btn" id="btn-geo" title="Centra sulla tua posizione" aria-label="Centra sulla mia posizione">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="6" r="3"/>
          <path d="M12 9 L12 15.5 M12 11 L7.2 9.2 M12 11 L16.8 9.2 M12 15.5 L8 21.5 M12 15.5 L16 21.5"/>
        </svg>
      </button>
      <a class="icon-btn" id="btn-info" href="https://www.paolomonti37788.it/money-in-space-2011/" target="_blank" rel="noopener noreferrer" title="Informazioni sul progetto" aria-label="Informazioni">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9.2"/>
          <line x1="12" y1="11" x2="12" y2="16.3"/>
          <circle cx="12" cy="7.3" r="0.95" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <div class="msg" id="geo-msg"></div>
    </div>
  </div>

  <div class="bottom-row">
    <div class="info-panel" id="info-panel">
      <div class="sat-name"><span class="pulse"></span>PAOLO MONTI 37788</div>
      <div class="row"><span>Lat/Lon</span><b id="info-latlon">—</b></div>
      <div class="row"><span>Alt</span><b id="info-alt">—</b></div>
      <div class="row"><span>Vel</span><b id="info-vel">—</b></div>
      <div class="row"><span>Dati TLE</span><b id="info-tle-age">—</b></div>
    </div>
  </div>
</div>

<div class="label user-label" id="user-label">La tua posizione</div>
<div class="trail-tooltip" id="trail-tooltip"></div>

<div class="loading-overlay" id="loading">
  <div class="ring"></div>
  <span>Caricamento globo…</span>
</div>

<div class="fallback" id="fallback">
  Il tuo browser non supporta la Canvas 2D, necessaria per visualizzare il globo.
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@4.1.4/dist/satellite.min.js"></script>

<script src="script.js"></script>
</body>
</html>
